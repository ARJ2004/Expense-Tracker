# Altus: the EC2 origin behind CloudFront. Reference copy; install as described in
# docs/deploy-web.md (step "Nginx origin block"). Your existing server block for
# http://<ip>/altus/ stays as it is until the cut-off date for old app builds.
#
# 1. Copy to /etc/nginx/conf.d/altus-origin.conf and replace ORIGIN_HOST with the EC2 public DNS
#    name (the same value as the CloudFormation parameter Ec2OriginDomain).
# 2. Create /etc/nginx/altus-origin-secret.conf (chmod 600, never in git) containing:
#        if ($http_x_origin_verify != "THE-ORIGIN-SECRET") { return 403; }
# 3. sudo nginx -t && sudo systemctl reload nginx

# CloudFront appends the visitor's IP as the LAST entry of X-Forwarded-For. Only CloudFront (with
# the secret header) can use this server block, so that last entry can be trusted.
map $http_x_forwarded_for $altus_viewer_ip {
    "~(?<last>[^,\s]+)\s*$" $last;
    default                $remote_addr;
}

# Access log without full IPs or invite codes: the last part of the address is dropped and
# /j/<code> is logged as /j/***.
map $altus_viewer_ip $altus_anon_ip {
    "~^(?<p>\d+\.\d+\.\d+)\.\d+$" "$p.0";
    "~^(?<p>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):" "$p::";
    default "-";
}
map $uri $altus_log_uri {
    "~^/j/" "/j/***";
    default $uri;
}
log_format altus_anon '$altus_anon_ip [$time_local] "$request_method $altus_log_uri" $status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name ORIGIN_HOST;

    include /etc/nginx/altus-origin-secret.conf;

    access_log /var/log/nginx/altus-origin.log altus_anon;
    client_max_body_size 11m;   # statement uploads: the API allows 10 MB

    location /v1/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (not append): the API trusts this single value for rate limits.
        proxy_set_header X-Forwarded-For $altus_viewer_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location /j/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $altus_viewer_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 404;
    }
}
