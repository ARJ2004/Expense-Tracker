name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expense_tracker_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/expense_tracker_test
      NODE_ENV: test
      # Throwaway values for CI only; real secrets live in each environment's .env.
      JWT_ACCESS_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      GOOGLE_WEB_CLIENT_ID: test-web-client.apps.googleusercontent.com
      DEV_AUTH_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm --filter "./packages/*" run build
      - name: Lint
        run: pnpm run lint
      - name: Type-check
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm run test
      - name: API end-to-end tests
        run: pnpm --filter @et/api run test:e2e
      - name: API client is up to date with the API
        run: |
          pnpm run api-client:generate
          git diff --exit-code packages/api-client/openapi.json packages/api-client/src/schema.d.ts
